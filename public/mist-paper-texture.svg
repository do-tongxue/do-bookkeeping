<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
  <defs>
    <filter id="wash" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.003 0.008" numOctaves="2" seed="11" stitchTiles="stitch" result="cloud" />
      <feColorMatrix in="cloud" type="matrix" values="0 0 0 0 .36  0 0 0 0 .60  0 0 0 0 .58  1 0 0 0 0" />
      <feComponentTransfer><feFuncA type="gamma" amplitude=".9" exponent="4" offset="0" /></feComponentTransfer>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
